# The signed release of the DX747 firmware, for The Firmware Hub (https://thefirmwarehub.com/kb/#sign): GitHub builds
# the package from this repository with the hub's shared workflow, signs it and attaches it to the release of the tag.
#
#   git tag v1.0 && git push origin v1.0
#
# The build is ./build.sh: the SDK's checks in Docker with JieLi's Linux toolchain (the one the shared workflow installs),
# then FM1_DX747.fwsc. Do not upload or replace the file by hand afterwards: the hub compares its SHA-256 with the signed one.
name: release
on:
  push:
    tags: ["v*"]
jobs:
  build:
    uses: zvenson/fm1-build/.github/workflows/build.yml@v1
    permissions:
      contents: write        # the release
      id-token: write        # the signing certificate
      attestations: write    # the attestation
    with:
      sdk: false             # DX747 does not use the JieLi AC79 SDK
      build: FM1_LINUX_TOOLCHAIN="$JIELI_TOOLCHAIN" ./build.sh
      packages: build/dx7/generated/FM1_DX747.fwsc
      # test: tools/dx747/sim/run-recipes.sh      # optional: the simulator recipes (a failing test stops the release)
